<!DOCTYPE html>
<html lang="th">
<head>

<body>
    <div class="icon">📶</div>
    <h1>ขาดการเชื่อมต่ออินเทอร์เน็ต</h1>

    <a href="/" class="btn">ลองใหม่อีกครั้ง</a>
